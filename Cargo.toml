[package]
name = "potpori"
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
description = "Nanbeige4.3-33B sharded across friends' NVIDIA GPUs over WAN — Rust and hand-written CUDA"
repository = "https://github.com/andthattoo/potpori"
build = "build.rs"

[[bin]]
name = "potpori"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
serde_bytes = "0.11"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
rustls-pemfile = "2"
# bf16 on the wire (tapped layers) and in checkpoints.
half = { version = "2.7", features = ["bytemuck"] }

# The CUDA driver API only: contexts, memory, module loading and kernel launches. The kernels
# are ours (`cu/`), compiled by `build.rs`. The driver library is opened at run time.
cudarc = { version = "0.19", default-features = false, features = [
    "std",
    "driver",
    "dynamic-loading",
    "cuda-version-from-build-system",
    "fallback-latest",
] }

# Weights and tokenizer.
hf-hub = { version = "0.4", default-features = false, features = ["rustls-tls", "ureq"] }
safetensors = "0.7"
bytemuck = "1"
memmap2 = "0.9"
tokenizers = "0.21"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
