[package]
name = "potpori"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
description = "Sharded LLM inference with your friends over WAN — pipeline-parallel + lossless speculative decoding on Luminal"
repository = "https://github.com/andthattoo/potpori"

[[bin]]
name = "potpori"
path = "src/main.rs"

[features]
default = []
# Inference-engine deps (Luminal model graph + safetensors weight loading + tokenizer);
# enabled by a backend feature.
engine = [
    "dep:luminal",
    "dep:luminal_nn",
    "dep:hf-hub",
    "dep:safetensors",
    "dep:half",
    "dep:bytemuck",
    "dep:memmap2",
    "dep:tokenizers",
    "dep:serde_json",
    "dep:tempfile",
]
# Backend selectors: pull in the Luminal backend crate (+ the engine deps) for the accelerator.
cuda = ["dep:luminal_cuda_lite", "luminal_cuda_lite/device", "dep:cudarc", "engine"]
metal = ["dep:luminal_metal", "dep:metal", "dep:objc", "engine"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
rustls-pemfile = "2"

# Compute substrate: upstream main as of 2026-10-29. Keep every Luminal crate on one revision.
# GPU-free coordination tests do not build the model/compiler dependency tree.
luminal = { git = "https://github.com/luminal-ai/luminal", rev = "1cbb9173dc53482bb6d87463aea2f1cfd94a1cf1", optional = true }
luminal_metal = { git = "https://github.com/luminal-ai/luminal", rev = "1cbb9173dc53482bb6d87463aea2f1cfd94a1cf1", optional = true }
luminal_cuda_lite = { git = "https://github.com/luminal-ai/luminal", rev = "1cbb9173dc53482bb6d87463aea2f1cfd94a1cf1", optional = true }
luminal_nn = { git = "https://github.com/luminal-ai/luminal", rev = "1cbb9173dc53482bb6d87463aea2f1cfd94a1cf1", optional = true }
cudarc = { git = "https://github.com/luminal-ai/cudarc.git", rev = "a42f3897b6d00aded8e6ac7ad258c72d8bad5596", optional = true, features = ["cuda-version-from-build-system", "fallback-latest"] }
tempfile = { version = "3", optional = true }


# Model weight loading + tokenizer, behind the `engine` feature.
hf-hub = { version = "0.4", default-features = false, features = ["rustls-tls", "ureq"], optional = true }
safetensors = { version = "0.7", optional = true }
half = { version = "2.7", features = ["bytemuck"], optional = true }
bytemuck = { version = "1", optional = true }
memmap2 = { version = "0.9", optional = true }
tokenizers = { version = "0.21", optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.31", optional = true }
objc = { version = "0.2", optional = true }
