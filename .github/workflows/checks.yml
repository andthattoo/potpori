name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # The build needs nvcc for the kernels. Tests that need a GPU are #[ignore]d; everything
  # else — drivers, wire, chain protocol, config, checkpoint reader, selector — runs here.
  build-and-test:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.9.1-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y curl build-essential pkg-config git ca-certificates
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal -c rustfmt,clippy
      - name: Format, lint and test
        run: |
          . "$HOME/.cargo/env"
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
